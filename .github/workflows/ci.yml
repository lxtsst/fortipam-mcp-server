name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-release:
    name: ${{ matrix.name }} (Python ${{ matrix.python-version }}, shard ${{ matrix.shard }}/${{ matrix.shards }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: deterministic-release
            python-version: "3.11"
            os: ubuntu-24.04
            scope: release
            workers: 4
            shard: 1
            shards: 4
          - name: deterministic-release
            python-version: "3.11"
            os: ubuntu-24.04
            scope: release
            workers: 4
            shard: 2
            shards: 4
          - name: deterministic-release
            python-version: "3.11"
            os: ubuntu-24.04
            scope: release
            workers: 4
            shard: 3
            shards: 4
          - name: deterministic-release
            python-version: "3.11"
            os: ubuntu-24.04
            scope: release
            workers: 4
            shard: 4
            shards: 4
          - name: deterministic-release
            python-version: "3.12"
            os: ubuntu-24.04
            scope: release
            workers: 4
            shard: 1
            shards: 4
          - name: deterministic-release
            python-version: "3.12"
            os: ubuntu-24.04
            scope: release
            workers: 4
            shard: 2
            shards: 4
          - name: deterministic-release
            python-version: "3.12"
            os: ubuntu-24.04
            scope: release
            workers: 4
            shard: 3
            shards: 4
          - name: deterministic-release
            python-version: "3.12"
            os: ubuntu-24.04
            scope: release
            workers: 4
            shard: 4
            shards: 4
          - name: native-macos
            python-version: "3.11"
            os: macos-15
            scope: native-macos
            workers: 1
            shard: 1
            shards: 1

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Set up standalone Python manager for native isolation
        if: runner.os == 'macOS'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.12.10"
          enable-cache: false

      - name: Prepare short source path for Unix sockets
        shell: bash
        run: |
          ci_root=$(mktemp -d /tmp/fpa-ci.XXXXXX)
          git clone --local --no-hardlinks "$GITHUB_WORKSPACE" "$ci_root"
          git -C "$ci_root" checkout --detach "$GITHUB_SHA"
          printf 'FPA_CI_ROOT=%s\n' "$ci_root" >> "$GITHUB_ENV"
          printf 'TMPDIR=/tmp\n' >> "$GITHUB_ENV"

      - name: Create isolated Python environment
        working-directory: ${{ env.FPA_CI_ROOT }}
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            uv venv --seed --managed-python --python 3.11.16 .venv
          else
            python -m venv .venv
          fi
          printf '%s/.venv/bin\n' "$FPA_CI_ROOT" >> "$GITHUB_PATH"

      - name: Install project and development dependencies
        working-directory: ${{ env.FPA_CI_ROOT }}
        run: >-
          python -m pip install
          --constraint deploy/docker/runtime-constraints.txt
          hatchling==1.32.0
          --editable '.[dev,bulk-import]'

      - name: Check repository hygiene
        working-directory: ${{ env.FPA_CI_ROOT }}
        run: python scripts/check_repository_hygiene.py

      - name: Verify deterministic release
        working-directory: ${{ env.FPA_CI_ROOT }}
        env:
          PYTEST_ADDOPTS: "-n ${{ matrix.workers }} --dist loadfile -ra -p scripts.ci_verify_release --ci-shard=${{ matrix.shard }} --ci-shards=${{ matrix.shards }}"
          PYTHONHASHSEED: "0"
        run: >-
          python scripts/ci_verify_release.py
          --scope "${{ matrix.scope }}"
          --log-directory "$RUNNER_TEMP/fortipam-release-checks"
