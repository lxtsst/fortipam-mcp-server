[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "fortipam-mcp-server"
version = "3.1.3"
description = "Governed FortiPAM MCP server with a default-readonly device surface and an explicitly selected lab workflow profile."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "lxtsst and contributors"}]
keywords = ["fortipam", "fortinet", "mcp", "pam", "security"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "asyncssh>=2.24.0,<3.0.0",
    "httpx>=0.28.0,<1.0.0",
    "mcp>=2.0.0,<3.0.0",
    "PyJWT[crypto]>=2.10.0,<3.0.0",
    "truststore>=0.10.4,<1.0.0",
    "uvicorn>=0.30.0,<1.0.0",
]

[project.urls]
Homepage = "https://github.com/lxtsst/fortipam-mcp-server"
Documentation = "https://github.com/lxtsst/fortipam-mcp-server/tree/main/docs"
Issues = "https://github.com/lxtsst/fortipam-mcp-server/issues"
Source = "https://github.com/lxtsst/fortipam-mcp-server"

[project.optional-dependencies]
dev = [
    "mypy>=1.0.0",
    "pytest>=7.0.0",
]

[project.scripts]
fortipam-mcp-server = "fortipam_mcp.server:main"
fortipam-mcp-http = "fortipam_mcp.http_server:main"
fortipam-mcp-local-oauth-hash = "fortipam_mcp.local_oauth:password_hash_main"
fortipam-mcp-http-smoke = "fortipam_mcp.http_smoke:main"
fortipam-mcp-smoke = "fortipam_mcp.mcp_smoke:main"
fortipam-scenario-check = "fortipam_mcp.scenario_check:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fortipam_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
strict_equality = true
warn_return_any = true
warn_unused_configs = true
