schema_version: "1.0"
status: design_only
product:
  name: FortiPAM
  target_version: "1.9.1"
  primary_source:
    source_id: fortipam-1.9.1-administration-guide
    evidence_status: documented
    note: "Product behavior authority only; it is not an API or permission contract."
evidence_status_values:
  verified: "Observed in a bounded non-production test and retained as compatibility evidence."
  documented: "Stated by a primary product or IaC source; not necessarily independently observed."
  inferred: "Architecture inference; requires validation before use."
  unknown: "No trustworthy contract is currently available."
  not_applicable: "This transport is outside the named action family; it is not an authorization decision."
global_invariants:
  - "No matrix row authorizes an endpoint, CLI command, Terraform apply, or FortiPAM write."
  - "An omitted API path/method means unknown, not unavailable or safe to infer."
  - "A product-object mention does not establish route-to-role or least-privilege mapping."
  - "All rows are disabled until a versioned adapter contract, dedicated identity, and acceptance evidence exist."
  - "Every mutable action additionally requires a valid human intent confirmation bound to the exact Final Intent Summary digest/revision."
  - "Every mutable action needs fixed minimized authoritative current-state and postcondition projections with verified query permissions; no projection means no write."
  - "C3 material must be delivered only through the C3 Material Provider design."
